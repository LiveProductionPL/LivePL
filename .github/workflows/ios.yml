# LivePL, Poczta LivePL i LivePL Connect na iPhone'a: budowa na Macach GitHuba, zrzuty z symulatora i (na życzenie) wysyłka do TestFlight.
# TestFlight rusza tylko wtedy, gdy opis zmiany zawiera [testflight] i są ustawione sekrety Apple (ios/README.md).
# Zmiana musi dotykać plików z listy niżej (pusta zmiana nie uruchomi budowy). Gdy workflow trafi na main,
# można go też uruchomić ręcznie: Actions → LivePL iOS → Run workflow (z zaznaczonym „TestFlight”).
name: LivePL iOS

on:
  push:
    branches: [ios]
    paths:
      - "ios/**"
      - "programy.json"
      - "assets/programy/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Wyślij do TestFlight"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  symulator:
    name: Budowa i zrzuty z symulatora
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Najnowszy Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Projekt Xcode z project.yml
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Budowa na symulator (LivePL, Poczta, Connect i TVML)
        run: |
          set -o pipefail
          : > build.log
          for SCHEMAT in LivePL Poczta Connect TVML; do
            xcodebuild -project ios/LivePL.xcodeproj -scheme "$SCHEMAT" -configuration Debug \
              -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "build-$SCHEMAT.log" | grep -E "error:|warning:|BUILD" || true
            cat "build-$SCHEMAT.log" >> build.log
            grep -q "BUILD SUCCEEDED" "build-$SCHEMAT.log"
          done

      - name: Ostrzeżenia kompilatora
        if: always()
        run: |
          grep -E "(error|warning): " build.log | grep "/ios/" | sort -u || echo "brak"

      - name: Zrzuty ekranu
        run: |
          P=build/Build/Products/Debug-iphonesimulator
          bash ios/narzedzia/zrzuty.sh $P/LivePL.app zrzuty $P/Poczta.app $P/Connect.app $P/TVML.app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zrzuty-${{ github.run_number }}
          path: |
            zrzuty/
            build.log
          retention-days: 14

  # Zrzuty do App Store osobno i równolegle (iPhone i iPad): pierwszy rozruch nowego symulatora na Macach GitHuba
  # trwa kilkanaście minut, więc razem z resztą nie mieściły się w limicie. TestFlight na nie nie czeka.
  sklep:
    name: Zrzuty do App Store (${{ matrix.urzadzenie }})
    if: contains(github.event.head_commit.message, '[zrzuty-sklep]')
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        urzadzenie: [iphone-69, ipad-13]
    steps:
      - uses: actions/checkout@v4

      - name: Najnowszy Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Projekt Xcode z project.yml
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Budowa na symulator
        run: |
          set -o pipefail
          for SCHEMAT in LivePL Poczta Connect TVML; do
            xcodebuild -project ios/LivePL.xcodeproj -scheme "$SCHEMAT" -configuration Debug \
              -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|BUILD" || true
          done

      - name: Zrzuty (${{ matrix.urzadzenie }})
        run: |
          P=build/Build/Products/Debug-iphonesimulator
          URZADZENIE=${{ matrix.urzadzenie }} bash ios/narzedzia/zrzuty-sklep.sh $P/LivePL.app $P/Poczta.app sklep $P/Connect.app

      - uses: actions/upload-artifact@v4
        with:
          name: sklep-${{ github.run_number }}-${{ matrix.urzadzenie }}
          path: sklep/
          retention-days: 30

  testflight:
    name: Wysyłka do TestFlight
    needs: symulator
    if: contains(github.event.head_commit.message, '[testflight]') || (github.event_name == 'workflow_dispatch' && inputs.testflight)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_HASLO: ${{ secrets.APPLE_CERT_HASLO }}
      APPLE_PROFIL: ${{ secrets.APPLE_PROFIL }}
      APPLE_PROFIL_POCZTA: ${{ secrets.APPLE_PROFIL_POCZTA }}
      APPLE_PROFIL_CONNECT: ${{ secrets.APPLE_PROFIL_CONNECT }}
      APPLE_PROFIL_TVML: ${{ secrets.APPLE_PROFIL_TVML }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Sekrety Apple
        run: |
          brak=0
          for s in APPLE_CERT_P12 APPLE_CERT_HASLO APPLE_PROFIL ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!s}" ]; then echo "::error::Brak sekretu $s (instrukcja w ios/README.md)"; brak=1; fi
          done
          if [ -z "$APPLE_PROFIL_POCZTA" ]; then echo "::warning::Brak sekretu APPLE_PROFIL_POCZTA: Poczta LivePL nie pójdzie do TestFlight"; fi
          if [ -z "$APPLE_PROFIL_CONNECT" ]; then echo "::warning::Brak sekretu APPLE_PROFIL_CONNECT: LivePL Connect nie pójdzie do TestFlight"; fi
          if [ -z "$APPLE_PROFIL_TVML" ]; then echo "::warning::Brak sekretu APPLE_PROFIL_TVML: TVML nie pójdzie do TestFlight"; fi
          exit $brak

      - name: Najnowszy Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Projekt Xcode z project.yml
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Certyfikat i profil do podpisu
        run: |
          KC="$RUNNER_TEMP/livepl.keychain-db"
          KCH=$(openssl rand -hex 24)
          security create-keychain -p "$KCH" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCH" "$KC"
          printf '%s' "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/podpis.p12"
          security import "$RUNNER_TEMP/podpis.p12" -P "$APPLE_CERT_HASLO" -A -t cert -f pkcs12 -k "$KC"
          rm -f "$RUNNER_TEMP/podpis.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCH" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            printf '%s' "$APPLE_PROFIL" | base64 --decode > "$d/livepl-app-store.mobileprovision"
            if [ -n "$APPLE_PROFIL_POCZTA" ]; then printf '%s' "$APPLE_PROFIL_POCZTA" | base64 --decode > "$d/poczta-app-store.mobileprovision"; fi
            if [ -n "$APPLE_PROFIL_CONNECT" ]; then printf '%s' "$APPLE_PROFIL_CONNECT" | base64 --decode > "$d/connect-app-store.mobileprovision"; fi
            if [ -n "$APPLE_PROFIL_TVML" ]; then printf '%s' "$APPLE_PROFIL_TVML" | base64 --decode > "$d/tvml-app-store.mobileprovision"; fi
          done

      - name: Archiwum i wysyłka do App Store Connect
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/asc"
          KLUCZ="$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$KLUCZ"
          # schemat | profil | opcje eksportu
          APLIKACJE="LivePL|LivePL App Store|ios/ExportOptions.plist"
          if [ -n "$APPLE_PROFIL_POCZTA" ]; then APLIKACJE="$APLIKACJE
          Poczta|Poczta LivePL App Store|ios/ExportOptions-poczta.plist"; fi
          if [ -n "$APPLE_PROFIL_CONNECT" ]; then APLIKACJE="$APLIKACJE
          Connect|LivePL Connect App Store|ios/ExportOptions-connect.plist"; fi
          if [ -n "$APPLE_PROFIL_TVML" ]; then APLIKACJE="$APLIKACJE
          TVML|TVML App Store|ios/ExportOptions-tvml.plist"; fi
          echo "$APLIKACJE" | while IFS='|' read -r SCHEMAT PROFIL OPCJE; do
            SCHEMAT=$(echo "$SCHEMAT" | xargs)
            echo "::group::$SCHEMAT"
            xcodebuild -project ios/LivePL.xcodeproj -scheme "$SCHEMAT" -configuration Release               -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/$SCHEMAT.xcarchive"               CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=WHKQ7CW48T               CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFIL"               CURRENT_PROJECT_VERSION=${{ github.run_number }}               archive 2>&1 | tee "archive-$SCHEMAT.log" | grep -E "error:|ARCHIVE" || true
            grep -q "ARCHIVE SUCCEEDED" "archive-$SCHEMAT.log"
            xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/$SCHEMAT.xcarchive"               -exportOptionsPlist "$OPCJE" -exportPath "$RUNNER_TEMP/eksport-$SCHEMAT"               -authenticationKeyPath "$KLUCZ" -authenticationKeyID "$ASC_KEY_ID"               -authenticationKeyIssuerID "$ASC_ISSUER_ID"
            echo "Wysłano $SCHEMAT, budowa ${{ github.run_number }}. Po przetworzeniu przez Apple (zwykle 5–20 minut) pojawi się w TestFlight."
            echo "::endgroup::"
          done

      - name: Sprzątanie
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/livepl.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/asc"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            rm -f "$d/livepl-app-store.mobileprovision" "$d/poczta-app-store.mobileprovision" "$d/connect-app-store.mobileprovision" "$d/tvml-app-store.mobileprovision"
          done
