# LivePL na Androida: budowa APK, zrzuty z emulatora i (gdy są sekrety) podpisane wydanie.
# Trzy aplikacje z tego samego kodu (android/app): przeglądarka LivePL, Poczta LivePL i LivePL Connect,
# a obok natywne TVML (android/tvml). Podpisane APK i AAB powstają tylko wtedy, gdy w GitHubie są sekrety klucza;
# z [play], [play-poczta], [play-connect] albo [play-tvml] w opisie zmiany AAB trafia też do Google Play
# jako szkic testu wewnętrznego (android/README.md).
name: LivePL Android

on:
  push:
    branches: [android]
    paths:
      - "android/**"
      - "programy.json"
      - "assets/programy/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  LIVEPL_BUDOWA: ${{ github.run_number }}
  # [tvml-test] w opisie zmiany: TVML z „Podglądem dnia” w Więcej, do testów wewnętrznych (tvml/build.gradle.kts)
  TVML_TESTY: ${{ contains(github.event.head_commit.message, '[tvml-test]') && '1' || '' }}

jobs:
  budowa:
    name: Debug APK i zrzuty z emulatora
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Debug APK (przeglądarka, Poczta, Connect, TVML) i lint
        working-directory: android
        run: bash ./gradlew assembleDebug lintPrzegladarkaDebug lintPocztaDebug lintConnectDebug :tvml:lintDebug --console=plain

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: livepl-debug-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/*/debug/*.apk
            android/app/build/reports/lint-results-*.html
            android/tvml/build/outputs/apk/debug/*.apk
            android/tvml/build/reports/lint-results-*.html
          retention-days: 14

      # demony Gradle i Kotlina z budowy trzymają kilka GB pamięci; emulator ich nie potrzebuje
      - name: Zatrzymanie demonów Gradle
        working-directory: android
        run: |
          bash ./gradlew --stop --console=plain
          pkill -f KotlinCompileDaemon || true
          free -m

      - name: KVM dla emulatora
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Zrzuty ekranu
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          script: CZEKAJ=20 bash android/narzedzia/zrzuty.sh android/app/build/outputs/apk/przegladarka/debug/app-przegladarka-debug.apk zrzuty android/app/build/outputs/apk/poczta/debug/app-poczta-debug.apk android/app/build/outputs/apk/connect/debug/app-connect-debug.apk android/tvml/build/outputs/apk/debug/tvml-debug.apk

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zrzuty-${{ github.run_number }}
          path: zrzuty/
          retention-days: 14

  wydanie:
    name: Podpisany APK i AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KLUCZ: ${{ secrets.ANDROID_KLUCZ }}
      ANDROID_KLUCZ_HASLO: ${{ secrets.ANDROID_KLUCZ_HASLO }}
      ANDROID_KLUCZ_ALIAS: ${{ secrets.ANDROID_KLUCZ_ALIAS }}
      ANDROID_PRZESYLANIE: ${{ secrets.ANDROID_PRZESYLANIE }}
      ANDROID_PRZESYLANIE_HASLO: ${{ secrets.ANDROID_PRZESYLANIE_HASLO }}
      ANDROID_KLUCZ_TVML: ${{ secrets.ANDROID_KLUCZ_TVML }}
      ANDROID_KLUCZ_TVML_HASLO: ${{ secrets.ANDROID_KLUCZ_TVML_HASLO }}
      # google-services.json TVML (Firebase Cloud Messaging); tvml/build.gradle.kts czyta go z tej zmiennej
      TVML_FIREBASE: ${{ secrets.TVML_FIREBASE }}
    steps:
      - name: Sekrety klucza
        id: klucz
        run: |
          if [ -z "$TVML_FIREBASE" ]; then
            echo "::warning::Brak sekretu TVML_FIREBASE, więc TVML zbuduje się bez powiadomień push (narzedzia/ustaw-sekrety.mjs --firebase)."
          fi
          if [ -z "$ANDROID_KLUCZ" ] || [ -z "$ANDROID_KLUCZ_HASLO" ]; then
            echo "::notice::Brak sekretów ANDROID_KLUCZ i ANDROID_KLUCZ_HASLO, więc bez podpisanego wydania (android/README.md)."
            echo "jest=nie" >> "$GITHUB_OUTPUT"
          else
            echo "jest=tak" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.klucz.outputs.jest == 'tak'

      - uses: actions/setup-java@v6
        if: steps.klucz.outputs.jest == 'tak'
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # APK na app.livepl.eu: klucz aplikacji (ten sam podpis co LivePL z Google Play), tylko procesory telefonów
      - name: Podpisany APK
        if: steps.klucz.outputs.jest == 'tak'
        working-directory: android
        run: |
          export LIVEPL_KLUCZ_PLIK="$RUNNER_TEMP/livepl.keystore"
          export LIVEPL_KLUCZ_HASLO="$ANDROID_KLUCZ_HASLO"
          export LIVEPL_KLUCZ_ALIAS="${ANDROID_KLUCZ_ALIAS:-livepl}"
          printf '%s' "$ANDROID_KLUCZ" | base64 --decode > "$LIVEPL_KLUCZ_PLIK"
          bash ./gradlew assemblePrzegladarkaRelease assemblePocztaRelease assembleConnectRelease -Plivepl.tylkoTelefony --console=plain
          rm -f "$LIVEPL_KLUCZ_PLIK"
          # TVML ma osobny klucz aplikacji; bez jego sekretów nie ma APK TVML
          if [ -n "$ANDROID_KLUCZ_TVML" ] && [ -n "$ANDROID_KLUCZ_TVML_HASLO" ]; then
            export TVML_KLUCZ_PLIK="$RUNNER_TEMP/tvml.keystore" TVML_KLUCZ_HASLO="$ANDROID_KLUCZ_TVML_HASLO" TVML_KLUCZ_ALIAS=tvml
            printf '%s' "$ANDROID_KLUCZ_TVML" | base64 --decode > "$TVML_KLUCZ_PLIK"
            bash ./gradlew :tvml:assembleRelease --console=plain
            rm -f "$TVML_KLUCZ_PLIK"
          else
            echo "::notice::Brak sekretów ANDROID_KLUCZ_TVML i ANDROID_KLUCZ_TVML_HASLO, więc bez APK TVML."
          fi

      # AAB do Google Play: klucz przesyłania (Google podpisuje potem kluczem aplikacji); bez niego klucz aplikacji
      - name: Podpisany AAB
        if: steps.klucz.outputs.jest == 'tak'
        working-directory: android
        run: |
          export LIVEPL_KLUCZ_PLIK="$RUNNER_TEMP/livepl-aab.keystore"
          if [ -n "$ANDROID_PRZESYLANIE" ] && [ -n "$ANDROID_PRZESYLANIE_HASLO" ]; then
            printf '%s' "$ANDROID_PRZESYLANIE" | base64 --decode > "$LIVEPL_KLUCZ_PLIK"
            export LIVEPL_KLUCZ_HASLO="$ANDROID_PRZESYLANIE_HASLO" LIVEPL_KLUCZ_ALIAS=przesylanie
            # TVML: ten sam klucz przesyłania (Google podpisuje potem osobnym kluczem aplikacji TVML)
            export TVML_KLUCZ_PLIK="$LIVEPL_KLUCZ_PLIK" TVML_KLUCZ_HASLO="$ANDROID_PRZESYLANIE_HASLO" TVML_KLUCZ_ALIAS=przesylanie
          else
            printf '%s' "$ANDROID_KLUCZ" | base64 --decode > "$LIVEPL_KLUCZ_PLIK"
            export LIVEPL_KLUCZ_HASLO="$ANDROID_KLUCZ_HASLO" LIVEPL_KLUCZ_ALIAS="${ANDROID_KLUCZ_ALIAS:-livepl}"
            # bez klucza przesyłania AAB TVML podpisuje jego własny klucz aplikacji (nigdy klucz LivePL)
            if [ -n "$ANDROID_KLUCZ_TVML" ] && [ -n "$ANDROID_KLUCZ_TVML_HASLO" ]; then
              export TVML_KLUCZ_PLIK="$RUNNER_TEMP/tvml-aab.keystore" TVML_KLUCZ_HASLO="$ANDROID_KLUCZ_TVML_HASLO" TVML_KLUCZ_ALIAS=tvml
              printf '%s' "$ANDROID_KLUCZ_TVML" | base64 --decode > "$TVML_KLUCZ_PLIK"
            fi
          fi
          ZADANIA="bundlePrzegladarkaRelease bundlePocztaRelease bundleConnectRelease"
          [ -n "${TVML_KLUCZ_PLIK:-}" ] && ZADANIA="$ZADANIA :tvml:bundleRelease"
          bash ./gradlew $ZADANIA --console=plain
          rm -f "$LIVEPL_KLUCZ_PLIK" "$RUNNER_TEMP/tvml-aab.keystore"

      - name: Sprawdzenie podpisu
        if: steps.klucz.outputs.jest == 'tak'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          WYJSCIE=android/app/build/outputs
          N=${{ github.run_number }}
          mkdir -p wydanie
          for a in przegladarka:LivePL poczta:Poczta-LivePL connect:LivePL-Connect; do
            WARIANT=${a%%:*}
            NAZWA=${a#*:}
            "$APKSIGNER" verify --verbose --print-certs "$WYJSCIE/apk/$WARIANT/release/app-$WARIANT-release.apk" | grep -E "Verified|SHA-256 digest|DN"
            keytool -printcert -jarfile "$WYJSCIE/bundle/${WARIANT}Release/app-$WARIANT-release.aab" | grep -E "Owner|SHA256" || true
            cp "$WYJSCIE/apk/$WARIANT/release/app-$WARIANT-release.apk" "wydanie/$NAZWA-$N.apk"
            cp "$WYJSCIE/bundle/${WARIANT}Release/app-$WARIANT-release.aab" "wydanie/$NAZWA-$N.aab"
          done
          # TVML: osobny moduł android/tvml i osobny klucz aplikacji (gdy są jego sekrety)
          TVML=android/tvml/build/outputs
          if [ -f "$TVML/apk/release/tvml-release.apk" ]; then
            "$APKSIGNER" verify --verbose --print-certs "$TVML/apk/release/tvml-release.apk" | grep -E "Verified|SHA-256 digest|DN"
            cp "$TVML/apk/release/tvml-release.apk" "wydanie/TVML-$N.apk"
          fi
          if [ -f "$TVML/bundle/release/tvml-release.aab" ]; then
            keytool -printcert -jarfile "$TVML/bundle/release/tvml-release.aab" | grep -E "Owner|SHA256" || true
            cp "$TVML/bundle/release/tvml-release.aab" "wydanie/TVML-$N.aab"
          fi
          ls -la wydanie
          (cd wydanie && sha256sum * | tee SHA256SUMS.txt)

      - uses: actions/upload-artifact@v7
        if: steps.klucz.outputs.jest == 'tak'
        with:
          name: livepl-wydanie-${{ github.run_number }}
          path: wydanie/
          retention-days: 30

      - name: Sprzątanie
        if: always()
        run: rm -f "$RUNNER_TEMP/livepl.keystore" "$RUNNER_TEMP/livepl-aab.keystore" "$RUNNER_TEMP/tvml.keystore" "$RUNNER_TEMP/tvml-aab.keystore"

  play:
    name: Wysyłka do Google Play (test wewnętrzny)
    needs: wydanie
    # [play] wysyła LivePL, [play-poczta] Pocztę LivePL, [play-connect] LivePL Connect, [play-tvml] TVML
    # (każda aplikacja musi już istnieć w Play Console)
    if: contains(github.event.head_commit.message, '[play]') || contains(github.event.head_commit.message, '[play-poczta]') || contains(github.event.head_commit.message, '[play-connect]') || contains(github.event.head_commit.message, '[play-tvml]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAY_KONTO_USLUGI: ${{ secrets.PLAY_KONTO_USLUGI }}
    steps:
      - name: Klucz konta usługi
        run: |
          if [ -z "$PLAY_KONTO_USLUGI" ]; then
            echo "::error::Brak sekretu PLAY_KONTO_USLUGI (android/README.md, Google Play)."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: livepl-wydanie-${{ github.run_number }}
          path: wydanie

      # wersja trafia do Play Console jako szkic; publikuje ją człowiek
      - uses: r0adkll/upload-google-play@v1
        if: contains(github.event.head_commit.message, '[play]')
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_KONTO_USLUGI }}
          packageName: eu.livepl.przegladarka
          releaseFiles: wydanie/LivePL-${{ github.run_number }}.aab
          track: internal
          status: draft

      - uses: r0adkll/upload-google-play@v1
        if: contains(github.event.head_commit.message, '[play-poczta]')
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_KONTO_USLUGI }}
          packageName: eu.livepl.poczta
          releaseFiles: wydanie/Poczta-LivePL-${{ github.run_number }}.aab
          track: internal
          status: draft

      - uses: r0adkll/upload-google-play@v1
        if: contains(github.event.head_commit.message, '[play-connect]')
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_KONTO_USLUGI }}
          packageName: eu.livepl.connect
          releaseFiles: wydanie/LivePL-Connect-${{ github.run_number }}.aab
          track: internal
          status: draft

      - uses: r0adkll/upload-google-play@v1
        if: contains(github.event.head_commit.message, '[play-tvml]')
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_KONTO_USLUGI }}
          packageName: pl.tvml
          releaseFiles: wydanie/TVML-${{ github.run_number }}.aab
          track: internal
          status: draft
