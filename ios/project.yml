# Projekt Xcode dwóch aplikacji na iPhone'a i iPada: przeglądarki LivePL i Poczty LivePL.
# Wspólny kod (karty, WKWebView, certyfikaty LivePL, tłumacz) jest w folderze Wspolne.
# Plik .xcodeproj nie leży w repozytorium: tworzy go XcodeGen (`xcodegen generate` w tym folderze),
# na Macach GitHuba robi to .github/workflows/ios.yml.
name: LivePL
options:
  bundleIdPrefix: eu.livepl
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: pl
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: WHKQ7CW48T
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SUPPORTS_MACCATALYST: false
    CODE_SIGN_STYLE: Automatic

targets:
  LivePL:
    type: application
    platform: iOS
    sources:
      - path: LivePL
      - path: Wspolne
      # ta sama lista programów co w LivePL na Windows
      - path: ../programy.json
        buildPhase: resources
      # urząd certyfikacji LivePL: publiczny root i nasze domeny, jak w LivePL na Windows (NaszeCA.swift)
      - path: ../assets/ca/livepl-root-ca-r1.crt
        buildPhase: resources
      - path: ../assets/ca/domeny.json
        buildPhase: resources
      # LivePL CA 1: sprawdzenie certyfikatu „Urządzenie LivePL” z urzędu (Urzadzenie.swift)
      - path: ../assets/ca/posrednie/livepl-ca-1.crt
        buildPhase: resources
    info:
      path: Wsparcie/Info.plist
      properties:
        CFBundleDisplayName: LivePL
        # sprawdzenie, czy Poczta LivePL jest zainstalowana (propozycja instalacji przy Poczcie)
        LSApplicationQueriesSchemes: [livepl-poczta]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: pl
        CFBundleLocalizations: [pl]
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.productivity
        # tylko HTTPS z systemu: zwolnione z deklaracji eksportowej
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: TloStartu
          UIImageName: Wstega
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # strony mogą prosić o zdjęcie, wideorozmowę albo lokalizację; iOS zawsze pyta o zgodę
        NSCameraUsageDescription: "Strona otwarta w LivePL prosi o aparat, np. do zdjęcia w formularzu albo wideorozmowy."
        NSMicrophoneUsageDescription: "Strona otwarta w LivePL prosi o mikrofon, np. do rozmowy albo nagrania."
        NSPhotoLibraryAddUsageDescription: "LivePL zapisze w Zdjęciach obrazek, który sam zapiszesz ze strony."
        NSLocationWhenInUseUsageDescription: "Strona otwarta w LivePL prosi o Twoją lokalizację. Dostanie ją tylko po Twojej zgodzie."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.livepl.przegladarka
        PRODUCT_NAME: LivePL

  # Poczta LivePL: sama poczta.livepl.eu na cały ekran, z własną ikoną i liczbą nieprzeczytanych na ikonie
  Poczta:
    type: application
    platform: iOS
    sources:
      - path: Poczta
      - path: Wspolne
      - path: ../programy.json
        buildPhase: resources
      - path: ../assets/ca/livepl-root-ca-r1.crt
        buildPhase: resources
      - path: ../assets/ca/domeny.json
        buildPhase: resources
      - path: ../assets/ca/posrednie/livepl-ca-1.crt
        buildPhase: resources
    info:
      path: Wsparcie/Poczta-Info.plist
      properties:
        CFBundleDisplayName: Poczta
        # livepl-poczta:// otwiera Pocztę LivePL (np. z przeglądarki LivePL)
        CFBundleURLTypes:
          - CFBundleURLName: eu.livepl.poczta
            CFBundleURLSchemes: [livepl-poczta]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: pl
        CFBundleLocalizations: [pl]
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.business
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: TloStartu
          UIImageName: LogoPoczty
          UIImageRespectsSafeAreaInsets: true
        # nagłówek poczty jest granatowy w dzień i w nocy, więc pasek stanu zawsze jasny
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Poczta prosi o aparat, gdy chcesz dołączyć zdjęcie do wiadomości."
        NSMicrophoneUsageDescription: "Poczta prosi o mikrofon, gdy nagrywasz wideo do wiadomości."
        NSPhotoLibraryAddUsageDescription: "Poczta zapisze w Zdjęciach obrazek z wiadomości, który sam zapiszesz."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.livepl.poczta
        PRODUCT_NAME: Poczta

schemes:
  LivePL:
    build:
      targets:
        LivePL: all
    run:
      config: Debug
    archive:
      config: Release
  Poczta:
    build:
      targets:
        Poczta: all
    run:
      config: Debug
    archive:
      config: Release
