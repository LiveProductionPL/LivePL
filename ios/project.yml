# Projekt Xcode trzech aplikacji na iPhone'a i iPada: przeglądarki LivePL, Poczty LivePL i LivePL Connect.
# Wspólny kod (karty, WKWebView, certyfikaty LivePL, tłumacz) jest w folderze Wspolne.
# Plik .xcodeproj nie leży w repozytorium: tworzy go XcodeGen (`xcodegen generate` w tym folderze),
# na Macach GitHuba robi to .github/workflows/ios.yml.
name: LivePL
options:
  bundleIdPrefix: eu.livepl
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: pl
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: WHKQ7CW48T
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SUPPORTS_MACCATALYST: false
    CODE_SIGN_STYLE: Automatic

targets:
  LivePL:
    type: application
    platform: iOS
    sources:
      - path: LivePL
      - path: Wspolne
      # ta sama lista programów co w LivePL na Windows
      - path: ../programy.json
        buildPhase: resources
      # urząd certyfikacji LivePL: publiczny root i nasze domeny, jak w LivePL na Windows (NaszeCA.swift)
      - path: ../assets/ca/livepl-root-ca-r1.crt
        buildPhase: resources
      - path: ../assets/ca/domeny.json
        buildPhase: resources
      # LivePL CA 1: sprawdzenie certyfikatu „Urządzenie LivePL” z urzędu (Urzadzenie.swift)
      - path: ../assets/ca/posrednie/livepl-ca-1.crt
        buildPhase: resources
    info:
      path: Wsparcie/Info.plist
      properties:
        CFBundleDisplayName: LivePL
        # sprawdzenie, czy Poczta LivePL jest zainstalowana (propozycja instalacji przy Poczcie)
        LSApplicationQueriesSchemes: [livepl-poczta]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: pl
        CFBundleLocalizations: [pl]
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.productivity
        # tylko HTTPS z systemu: zwolnione z deklaracji eksportowej
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: TloStartu
          UIImageName: Wstega
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # strony mogą prosić o zdjęcie, wideorozmowę albo lokalizację; iOS zawsze pyta o zgodę
        NSCameraUsageDescription: "Strona otwarta w LivePL prosi o aparat, np. do zdjęcia w formularzu albo wideorozmowy."
        NSMicrophoneUsageDescription: "Strona otwarta w LivePL prosi o mikrofon, np. do rozmowy albo nagrania."
        NSPhotoLibraryAddUsageDescription: "LivePL zapisze w Zdjęciach obrazek, który sam zapiszesz ze strony."
        NSLocationWhenInUseUsageDescription: "Strona otwarta w LivePL prosi o Twoją lokalizację. Dostanie ją tylko po Twojej zgodzie."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.livepl.przegladarka
        PRODUCT_NAME: LivePL

  # Poczta LivePL: sama poczta.livepl.eu na cały ekran, z własną ikoną i liczbą nieprzeczytanych na ikonie
  Poczta:
    type: application
    platform: iOS
    sources:
      - path: Poczta
      - path: Wspolne
      - path: ../programy.json
        buildPhase: resources
      - path: ../assets/ca/livepl-root-ca-r1.crt
        buildPhase: resources
      - path: ../assets/ca/domeny.json
        buildPhase: resources
      - path: ../assets/ca/posrednie/livepl-ca-1.crt
        buildPhase: resources
    info:
      path: Wsparcie/Poczta-Info.plist
      properties:
        CFBundleDisplayName: Poczta
        # livepl-poczta:// otwiera Pocztę LivePL (np. z przeglądarki LivePL)
        CFBundleURLTypes:
          - CFBundleURLName: eu.livepl.poczta
            CFBundleURLSchemes: [livepl-poczta]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: pl
        CFBundleLocalizations: [pl]
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.business
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: TloStartu
          UIImageName: LogoPoczty
          UIImageRespectsSafeAreaInsets: true
        # nagłówek poczty jest granatowy w dzień i w nocy, więc pasek stanu zawsze jasny
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Poczta prosi o aparat, gdy chcesz dołączyć zdjęcie do wiadomości."
        NSMicrophoneUsageDescription: "Poczta prosi o mikrofon, gdy nagrywasz wideo do wiadomości."
        NSPhotoLibraryAddUsageDescription: "Poczta zapisze w Zdjęciach obrazek z wiadomości, który sam zapiszesz."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.livepl.poczta
        PRODUCT_NAME: Poczta

  # LivePL Connect: zdalny pulpit (connect.livepl.eu) na cały ekran, z mostkiem do iPhone'a (MostConnect.swift)
  Connect:
    type: application
    platform: iOS
    sources:
      - path: Connect
      - path: Wspolne
      - path: ../programy.json
        buildPhase: resources
      - path: ../assets/ca/livepl-root-ca-r1.crt
        buildPhase: resources
      - path: ../assets/ca/domeny.json
        buildPhase: resources
      - path: ../assets/ca/posrednie/livepl-ca-1.crt
        buildPhase: resources
    info:
      path: Wsparcie/Connect-Info.plist
      properties:
        # samo „Connect” Apple odrzucił jako zajętą nazwę (ITMS-90129), więc pod ikoną i w paczce: LivePL Connect
        CFBundleDisplayName: LivePL Connect
        CFBundleName: LivePL Connect
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: pl
        CFBundleLocalizations: [pl]
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.utilities
        # WebRTC (DTLS) i HTTPS z WebKit, czyli standardowe szyfrowanie systemu: zwolnione z deklaracji eksportowej
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: TloStartu
          UIImageName: LogoConnect
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # zdalny ekran najlepiej widać w poziomie
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # WebRTC szuka najkrótszej drogi do komputera, także w tej samej sieci Wi-Fi; iOS może o to zapytać
        NSLocalNetworkUsageDescription: "Connect łączy się bezpośrednio z komputerem. Gdy jest w tej samej sieci Wi-Fi, obraz idzie szybciej przez sieć lokalną."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.livepl.connect
        PRODUCT_NAME: Connect

  # TVML 2.0: serwis informacyjny tvml.pl, natywnie (SwiftUI), w tym samym wpisie App Store co TVML z 2019.
  # Wszystko, co pokazuje, ustawia redakcja w panelu tvml.pl (API /api/v1, do tego czasu stare akcje tvml-db.php).
  # Bez kodu z Wspolne: to nie przeglądarka i nie rejestruje urządzeń czytelników w urzędzie LivePL.
  TVML:
    type: application
    platform: iOS
    sources:
      - path: TVML
        excludes:
          - "zrodla/**"
    info:
      path: Wsparcie/TVML-Info.plist
      properties:
        CFBundleDisplayName: TVML
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: pl
        CFBundleLocalizations: [pl]
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.news
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: TloStartu
          UIImageName: LogoStartu
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # „Odsłuchaj” czyta artykuł także przy zablokowanym ekranie
        UIBackgroundModes: [audio]
        # „Zgłoś zdarzenie (Alert TVML)”: zdjęcie lub film z aparatu i położenie tylko na prośbę (AlertWidok.swift)
        NSCameraUsageDescription: "TVML prosi o aparat, gdy chcesz zrobić zdjęcie lub film do zgłoszenia zdarzenia."
        NSMicrophoneUsageDescription: "TVML prosi o mikrofon, gdy nagrywasz film do zgłoszenia zdarzenia."
        NSLocationWhenInUseUsageDescription: "TVML dołączy Twoje położenie do zgłoszenia zdarzenia tylko wtedy, gdy wybierzesz „Dodaj moje położenie”."
        # nagłówki jak na tvml.pl: Open Sans (zmienna, SIL OFL, licencja w TVML/Czcionki/OFL.txt)
        UIAppFonts: [OpenSans.ttf]
    # powiadomienia o nowych wpisach (APNs, serwer tvml.pl); profil „TVML App Store” ma aps-environment production
    entitlements:
      path: Wsparcie/TVML.entitlements
      properties:
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.LiveProduction.TVML
        PRODUCT_NAME: TVML
        MARKETING_VERSION: "2.2"
        # ikony na zimę i święta wybiera panel (Ustawienia → Wygląd), więc są w aplikacji od początku
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "IkonaZima IkonaSwieta"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES

schemes:
  LivePL:
    build:
      targets:
        LivePL: all
    run:
      config: Debug
    archive:
      config: Release
  Poczta:
    build:
      targets:
        Poczta: all
    run:
      config: Debug
    archive:
      config: Release
  Connect:
    build:
      targets:
        Connect: all
    run:
      config: Debug
    archive:
      config: Release
  TVML:
    build:
      targets:
        TVML: all
    run:
      config: Debug
    archive:
      config: Release
