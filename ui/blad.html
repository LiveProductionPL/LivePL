<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>Strona się nie wczytała</title>
  <link rel="stylesheet" href="strony.css">
  <link rel="stylesheet" href="blad.css">
</head>
<body>
  <main>
    <div class="telewizor" id="telewizor" aria-hidden="true"></div>

    <p class="gdzie" id="gdzie" hidden></p>
    <h1 id="naglowek">Nie udało się otworzyć strony</h1>
    <p class="opis" id="opis"></p>

    <div class="przyciski">
      <a class="przycisk glowny" id="ponow" href="#">Spróbuj teraz</a>
    </div>

    <div class="odliczanie" id="odliczanie" hidden>
      <div class="pasek-postepu"><span id="postep"></span></div>
      <p id="odliczanie-tekst" aria-live="polite"></p>
    </div>

    <section class="rady" id="rady" hidden>
      <h2>Co możesz zrobić</h2>
      <ul id="rady-lista"></ul>
    </section>

    <details class="szczegoly" id="szczegoly" hidden>
      <summary>Szczegóły techniczne</summary>
      <dl id="szczegoly-lista"></dl>
    </details>
  </main>
  <script src="ikony.js"></script>
  <script src="blad.js"></script>
</body>
</html>
